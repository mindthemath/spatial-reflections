<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spatial Reflections by Michael Pilosov</title>
<style>
:root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #090b10; color: #e6e9ef; }
body { max-width: 1100px; margin: 0 auto; padding: clamp(24px, 6vw, 80px); }
header { margin-bottom: 48px; }
h1 { font-size: clamp(2rem, 6vw, 5rem); line-height: .95; max-width: 12ch; margin: 0 0 24px; }
#work { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
article { border: 1px solid #414b5c; background: #11151d; }
article a { display: block; color: inherit; text-decoration: none; }
article img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #000; }
article div { padding: 16px; }
article h2 { margin: 0 0 8px; font-size: 1.15rem; }
article p { margin: 0; color: #aeb9c9; }
#status { color: #aeb9c9; }
a:focus-visible { outline: 2px solid #80caff; outline-offset: 3px; }
</style>
</head>
<body>
<header>
<h1>Spatial Reflections</h1>
<h2><i>I am Trapped in a Beautiful House of Mirrors</i></h2>
<p>A collection of photographic environments reflected by a rotating four-dimensional shape.</p>
</header>
<main>
<p id="status">Loading work…</p>
<section id="work" aria-label="Published work"></section>
</main>
<script type="module">
const status=document.querySelector('#status'),root=document.querySelector('#work');
try {
  const response=await fetch('./catalog.json');
  if(!response.ok)throw new Error('The catalog could not be loaded.');
  const catalog=await response.json();
  status.hidden=!!catalog.work.length;
  if(!catalog.work.length)status.textContent='No work has been published yet.';
  for(const item of [...catalog.work].reverse()){
    const article=document.createElement('article'),link=document.createElement('a'),image=document.createElement('img'),body=document.createElement('div'),title=document.createElement('h2'),description=document.createElement('p');
    link.href=item.url;image.src=item.thumbnail;image.alt='';image.loading='lazy';title.textContent=item.title;description.textContent=item.description||'';
    body.append(title);if(item.description)body.append(description);link.append(image,body);article.append(link);root.append(article);
  }
} catch(error) { status.textContent=error.message; }
</script>
</body>
</html>
