<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Index of / · Spatial Reflections by Michael Pilosov</title>
<style>
/* mod_autoindex ships no stylesheet: browser defaults are the look.
   Everything below only keeps that look intact on small screens. */
pre { white-space: pre-wrap; }
img { image-rendering: pixelated; }
td, th { vertical-align: top; }
td.m { white-space: nowrap; }
@media (max-width: 640px) {
  table, tbody { display: block; }
  tr.head { display: none; }
  tr.rule { display: block; }
  tr.rule th { display: block; padding: 0; }
  tr.entry { display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 6px; padding: 2px 0; }
  tr.entry td { padding: 0; text-align: left; }
  tr.entry td.i { grid-row: 1 / span 3; }
  tr.entry td.n, tr.entry td.m, tr.entry td.d { grid-column: 2; }
}
</style>
</head>
<body>
<h1>Index of /</h1>
<pre id="header" hidden></pre>
<table>
 <tbody id="listing">
  <tr class="head"><th valign="top"><img src="icons/blank.gif" alt="[ICO]" width="20" height="22"></th><th><a data-column="N">Name</a></th><th><a data-column="M">Last modified</a></th><th><a data-column="D">Description</a></th></tr>
  <tr class="rule"><th colspan="4"><hr></th></tr>
  <tr class="rule"><th colspan="4"><hr></th></tr>
 </tbody>
</table>
<address id="signature">SpatialReflections/2026 (Mathematical Michael) Server</address>
<script type="module">
const listing = document.querySelector('#listing');
const [, closingRule] = listing.querySelectorAll('tr.rule');
const params = new URLSearchParams(location.search.replaceAll(';', '&'));
const column = 'NMD'.includes(params.get('C') || '') && params.get('C') ? params.get('C') : 'M';
const order = params.get('O') === 'A' || params.get('O') === 'D' ? params.get('O') : (params.get('C') ? 'A' : 'D');

// Like Apache: the active column's link flips the order; the others sort ascending.
for (const link of listing.querySelectorAll('a[data-column]')) {
  const next = link.dataset.column === column && order === 'A' ? 'D' : 'A';
  link.href = `?C=${link.dataset.column};O=${next}`;
}

const stamp = iso => {
  const date = new Date(iso);
  return Number.isNaN(date.getTime()) ? '' : date.toISOString().slice(0, 16).replace('T', ' ');
};
// Apache has no title column: the title leads the description instead.
const describe = item => [item.title, item.description].filter(Boolean).join(': ');
const keys = {
  N: item => item.slug, M: item => item.publishedAt || '', D: describe
};
const cell = (className, content, align) => {
  const td = document.createElement('td');
  td.className = className;
  if (align) td.align = align;
  if (typeof content === 'string') td.textContent = content; else td.append(content);
  return td;
};

function row(item) {
  const tr = document.createElement('tr');
  tr.className = 'entry';
  const icon = document.createElement('img');
  Object.assign(icon, { src: 'icons/folder.gif', alt: '[DIR]', width: 20, height: 22 });
  const link = document.createElement('a');
  link.href = item.url;
  link.textContent = `${item.slug}/`;
  tr.append(
    cell('i', icon), cell('n', link),
    cell('m', `${stamp(item.publishedAt)}  `, 'right'),
    cell('d', describe(item) || '\u00a0')
  );
  return tr;
}

// Like Apache's HeaderName: HEADER.txt is shown verbatim, preformatted.
fetch('./HEADER.txt').then(response => response.ok ? response.text() : '').then(text => {
  const header = document.querySelector('#header');
  header.textContent = text;
  header.hidden = !text.trim();
}).catch(() => {});

try {
  const response = await fetch('./catalog.json');
  if (!response.ok) throw new Error('The catalog could not be loaded.');
  const { work } = await response.json();
  const key = keys[column];
  const sorted = [...work].sort((a, b) => key(a).localeCompare(key(b)) * (order === 'A' ? 1 : -1));
  closingRule.before(...sorted.map(row));
} catch (error) {
  const tr = document.createElement('tr');
  tr.className = 'entry';
  tr.append(cell('i', ''), cell('n', error.message));
  closingRule.before(tr);
}

const port = location.port || (location.protocol === 'https:' ? '443' : '80');
document.querySelector('#signature').textContent += ` at ${location.hostname || 'localhost'} Port ${port}`;
</script>
</body>
</html>
