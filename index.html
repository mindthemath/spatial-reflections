<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflective Rotating Tesseract</title>
    <style>
        body { 
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        button, select, input {
            border-radius: 0;
        }
        button {
            appearance: none;
            background: #eee;
            color: #111;
            border: 1px solid #888;
        }
        .viewer-skybox { border-bottom: 1px solid #555; padding-bottom: 10px; margin-bottom: 12px; }
        .skybox-heading { font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; }
        #active-skybox { overflow-wrap: anywhere; font-size: 13px; }
        .skybox-actions { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
        .skybox-actions button, #switch-to-chrome { padding: 5px; cursor: pointer; }
        #skybox-status { font-size: 11px; line-height: 1.4; color: #a8bacf; margin: 8px 0; }
        #skybox-status.error, #skybox-library-status.error { color: #ffaaa0; }
        .skybox-links { display: grid; gap: 5px; margin-top: 8px; font-size: 11px; }
        .skybox-links a, #skybox-library-dialog a { color: #80caff; }
        #skybox-library-dialog, #publish-skybox-dialog, #video-export-dialog, #confirm-action-dialog { background: #191d25; color: #d9dee8; border: 1px solid #52637c; border-radius: 0; padding: 20px; width: min(900px, 90vw); max-height: 85vh; overflow: auto; font: 13px system-ui, sans-serif; }
        #publish-skybox-dialog { width: min(480px, 90vw); }
        #video-export-dialog { width: min(560px, 90vw); }
        #confirm-action-dialog { width: min(420px, 90vw); }
        #confirm-action-dialog p { margin: 12px 0 0; line-height: 1.45; }
        #skybox-library-dialog::backdrop, #publish-skybox-dialog::backdrop, #video-export-dialog::backdrop, #confirm-action-dialog::backdrop { background: #000c; }
        #publish-skybox-dialog form, #publish-skybox-dialog label { display: grid; gap: 7px; }
        #publish-skybox-dialog form { gap: 14px; }
        #publish-skybox-dialog input, #publish-skybox-dialog textarea { box-sizing: border-box; width: 100%; padding: 7px; background: #10141b; color: #eef3f8; border: 1px solid #657184; font: inherit; }
        #publish-skybox-dialog textarea { min-height: 80px; resize: vertical; }
        #publish-result { overflow-wrap: anywhere; }
        #video-export-dialog label { display: grid; gap: 5px; }
        #video-export-dialog input, #video-export-dialog select { box-sizing: border-box; width: 100%; padding: 7px; background: #10141b; color: #eef3f8; border: 1px solid #657184; border-radius: 0; font: inherit; }
        #video-export-dialog button, #confirm-action-dialog button { padding: 7px 10px; border-radius: 0; cursor: pointer; }
        #video-export-dialog button:disabled { opacity: .45; cursor: default; }
        .video-export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .video-export-grid[hidden] { display: none; }
        .video-export-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 14px; }
        #video-export-summary { border: 1px solid #414b5c; background: #10141b; padding: 10px; line-height: 1.55; margin-top: 12px; }
        #video-export-progress { width: 100%; margin-top: 12px; accent-color: #80caff; }
        #video-export-status { min-height: 1.5em; overflow-wrap: anywhere; color: #a8bacf; }
        #video-export-status.error { color: #ffaaa0; }
        #video-export-result a { color: #80caff; }
        @media (max-width: 560px) { .video-export-grid { grid-template-columns: 1fr; } }
        .library-heading { display: flex; gap: 10px; align-items: center; }
        .library-heading strong { margin-right: auto; }
        #skybox-export-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
        .skybox-card { border: 1px solid #414b5c; padding: 10px; display: grid; gap: 7px; }
        .skybox-card img { width: 100%; height: 130px; object-fit: cover; }
        .skybox-card small { color: #9cadc3; }
        #controlPanel button:focus-visible, #controlPanel select:focus-visible, #controlPanel input:focus-visible, #skybox-library-dialog button:focus-visible, #confirm-action-dialog button:focus-visible { outline: 2px solid #80caff; outline-offset: 2px; }
        #controlPanel button, #controlPanel select {
            appearance: none;
            -webkit-appearance: none;
            background-color: #1a2029;
            color: #eef3f8;
            border: 1px solid #657184;
            border-radius: 0;
        }
        #controlPanel button:hover:not(:disabled) { background-color: #303b4b; border-color: #91b9e0; }
        #controlPanel button:active:not(:disabled) { background-color: #43546a; }
        #controlPanel button:disabled { opacity: .4; cursor: default; }
        #controlPanel select {
            padding: 5px 26px 5px 7px !important;
            background-image:
                linear-gradient(45deg, transparent 50%, #d9e2ec 50%),
                linear-gradient(135deg, #d9e2ec 50%, transparent 50%);
            background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
        }
        #controlPanel input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            margin: 0;
            vertical-align: middle;
            background: #151a22;
            border: 1px solid #8190a4;
        }
        #controlPanel input[type="checkbox"]:checked {
            background: #80caff;
            box-shadow: inset 0 0 0 3px #151a22;
        }
        #controlPanel input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            height: 20px;
            min-width: 0;
            margin: 0;
            padding: 0;
            background: transparent;
        }
        #controlPanel input[type="range"]::-webkit-slider-runnable-track {
            height: 5px;
            background: #778398;
            border: 1px solid #aab4c2;
        }
        #controlPanel input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            margin-top: -6px;
            background: #eef4fa;
            border: 2px solid #17202b;
            border-radius: 0;
        }
        #controlPanel input[type="range"]::-moz-range-track {
            height: 3px;
            background: #778398;
            border: 1px solid #aab4c2;
            border-radius: 0;
        }
        #controlPanel input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #eef4fa;
            border: 2px solid #17202b;
            border-radius: 0;
        }
        #controlPanel input[type="range"]:disabled { opacity: .4; }
        #controlPanel .range-stepper {
            display: grid;
            grid-template-columns: 24px minmax(0, 1fr) 24px;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }
        #controlPanel .range-stepper button {
            width: 24px;
            height: 24px;
            padding: 0;
            font: bold 16px/1 Arial, sans-serif;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three.module.js",
                "three/addons/": "./vendor/"
            }
        }
    </script>
    <script id="piece-config" type="application/json"></script>
    <script type="module" src="tesseract.js"></script>
</body>
</html>
